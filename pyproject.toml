[project]
name = "readtome"
version = "0.1.0"
description = "Local PDF and text reader that describes figures out loud"
readme = "README.md"
authors = [
    { name = "Jason Paul Miller", email = "jasonversamiller@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.0.0; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "fastapi>=0.164.0",
    "httpx>=0.28.1",
    "kokoro-onnx>=0.6.1",
    "matplotlib>=3.11.2",
    "mlx-vlm>=0.8.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "numpy>=2.1.0",
    "pillow>=11.0.0",
    "pymupdf>=2.1",
    "python-multipart>=0.0.34",
    "soundfile>=0.13.0",
    "torch>=2.6.0; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "torchvision>=0.21.0; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "transformers>=5.0.0",
    "uvicorn[standard]>=0.34.0",
]

[project.scripts]
readtome = "readtome:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
